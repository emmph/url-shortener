apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secrets
  namespace: url-shortener
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-with-strong-postgres-password"
  DATABASE_URL: "postgresql+asyncpg://url_shortener:replace-with-strong-postgres-password@postgres:5432/url_shortener"
  IP_HASH_SALT: "replace-with-long-random-salt"
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "replace-with-strong-admin-password"
  JWT_SECRET_KEY: "replace-with-minimum-32-char-jwt-secret"
