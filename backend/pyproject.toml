[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener-backend"
version = "1.0.0"
description = "High-performance, secure URL shortener microservice with CVE scanning, Liquid Glass UI and Designsystemet Admin"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyJWT>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "httpx>=0.27.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
