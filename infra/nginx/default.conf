upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;
    client_header_timeout 5s;
    client_body_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Unified Error Page Routing for Nginx-level Errors
    error_page 413 = /error/413?reason=payload_too_large;
    error_page 502 504 = /error/503?reason=maintenance;

    # API & Operational Probes -> Backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(healthz|readyz|metrics)$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Immutable Static Assets & Favicon
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        try_files /favicon.svg =404;
    }

    location = /favicon.ico {
        expires 7d;
        try_files /favicon.svg =404;
    }

    # SPA Routes (Home, Scanning, Error Catalog, Admin, Stats)
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(scanning|error|admin|stats)(/|$) {
        try_files $uri /index.html;
    }

    # Short Code Redirects -> Backend (excluding SPA prefixes and static files)
    location ~ ^/[a-zA-Z0-9_-]{4,16}$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
