services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
      POSTGRES_USER: ${POSTGRES_USER:-url_shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-url_shortener} -d ${POSTGRES_DB:-url_shortener}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url-shortener-migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:-change_me_strong_postgres_password}@postgres:5432/${POSTGRES_DB:-url_shortener}
      REDIS_URL: redis://redis:6379/0
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD-admin123}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      IP_HASH_SALT: ${IP_HASH_SALT:-change_me_long_random_salt_for_daily_ip_hash}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_super_secret_jwt_key_at_least_32_bytes}
      RUN_EMBEDDED_WORKER: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url-shortener-backend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:-change_me_strong_postgres_password}@postgres:5432/${POSTGRES_DB:-url_shortener}
      REDIS_URL: redis://redis:6379/0
      APP_NAME: ${APP_NAME:-URL Shortener}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IP_HASH_SALT: ${IP_HASH_SALT:-change_me_long_random_salt_for_daily_ip_hash}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD-admin123}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_super_secret_jwt_key_at_least_32_bytes}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SCANNER_MIN_BLOCK_CVSS: ${SCANNER_MIN_BLOCK_CVSS:-4.0}
      OSV_API_URL: ${OSV_API_URL:-https://api.osv.dev/v1/query}
      NVD_API_KEY: ${NVD_API_KEY:-}
      ALLOW_MEMORY_FALLBACK: "false"
      SERVE_FRONTEND_DIST: "false"
      RUN_EMBEDDED_WORKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: url-shortener-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 96M

volumes:
  postgres_data:
  redis_data:
